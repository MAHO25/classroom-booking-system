{% extends "base.html" %}

{% block title %}Sign In - UniReserve{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">
        <div class="card bg-white shadow-sm border-0 rounded-4 overflow-hidden">
            <!-- Header Banner -->
            <div class="bg-primary text-white p-4 text-center">
                <i class="bi bi-shield-lock-fill fs-1 d-block mb-2"></i>
                <h3 class="fw-bold mb-1">UniReserve Portal</h3>
                <p class="small mb-0 text-white-50">Please select your portal to sign in</p>
            </div>

            <!-- Role Selector Tabs: User vs Admin -->
            <div class="p-3 bg-light border-bottom">
                <ul class="nav nav-pills nav-fill" id="loginTabs" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link {% if active_tab != 'admin' %}active{% endif %} fw-bold" id="user-tab" data-bs-toggle="tab" data-bs-target="#user-pane" type="button">
                            <i class="bi bi-person-fill me-1"></i> Student / User
                        </button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link {% if active_tab == 'admin' %}active{% endif %} fw-bold" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin-pane" type="button">
                            <i class="bi bi-shield-check me-1"></i> Administrator
                        </button>
                    </li>
                </ul>
            </div>

            <div class="card-body p-4 p-md-5">
                <div class="tab-content" id="loginTabContent">
                    <!-- 1. USER SIGN IN PANE -->
                    <div class="tab-pane fade {% if active_tab != 'admin' %}show active{% endif %}" id="user-pane">
                        <form method="POST" action="{{ url_for('login') }}">
                            <input type="hidden" name="login_type" value="user">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" name="login_id" class="form-control" placeholder="e.g. alice or alice.j@university.edu" value="{{ login_id if login_id else '' }}" required autofocus>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key"></i></span>
                                    <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Reserve Rooms
                            </button>
                        </form>

                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-muted small">New to the system?</span><br>
                            <a href="{{ url_for('register') }}" class="btn btn-outline-primary btn-sm mt-2 fw-semibold px-4">
                                <i class="bi bi-person-plus me-1"></i> Create a New Account (Sign Up)
                            </a>
                        </div>
                    </div>

                    <!-- 2. ADMIN SIGN IN PANE -->
                    <div class="tab-pane fade {% if active_tab == 'admin' %}show active{% endif %}" id="admin-pane">
                        <form method="POST" action="{{ url_for('login') }}">
                            <input type="hidden" name="login_type" value="admin">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Administrator Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                    <input type="text" name="admin_username" class="form-control" placeholder="Enter administrator username" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Administrator Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                    <input type="password" name="admin_password" class="form-control" placeholder="Enter administrator password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold shadow-sm">
                                <i class="bi bi-shield-check me-1"></i> Sign In as Administrator
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
